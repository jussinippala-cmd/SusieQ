; SusieQ Masto Units — ESP32-CAM × 2
; Keula (forward) and Perä (aft) cameras in mast housing.
; Build with -e keula or -e pera to select unit.

[common]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
lib_deps =
    ottowinter/ESPAsyncWebServer-esphome @ ^3.1.0
    mathieucarbou/AsyncTCP @ ^3.1.4
    bblanchon/ArduinoJson @ ^7.0.0
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DCONFIG_LWIP_TCP_SND_BUF_DEFAULT=16384
    -DCONFIG_LWIP_TCP_WND_DEFAULT=8192
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs

; ─── Keulakamera — USB flash (ensimmäinen kerta) ─────────────────────
[env:keula]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
board_build.partitions = ${common.board_build.partitions}
board_build.filesystem = ${common.board_build.filesystem}
build_flags =
    ${common.build_flags}
    -DMASTO_KEULA

; ─── Keulakamera — WiFi OTA ──────────────────────────────────────────
; Yhdistä kannettava SusieQ-Net-verkkoon, aja pio run -e keula-ota -t upload
[env:keula-ota]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
board_build.partitions = ${common.board_build.partitions}
board_build.filesystem = ${common.board_build.filesystem}
build_flags =
    ${common.build_flags}
    -DMASTO_KEULA
upload_protocol = espota
upload_port = 192.168.8.101
upload_flags =
    --auth=susieq_ota

; ─── Peräkamera — USB flash (ensimmäinen kerta) ──────────────────────
[env:pera]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
board_build.partitions = ${common.board_build.partitions}
board_build.filesystem = ${common.board_build.filesystem}
build_flags =
    ${common.build_flags}
    -DMASTO_PERA

; ─── Peräkamera — WiFi OTA ───────────────────────────────────────────
; Yhdistä kannettava SusieQ-Net-verkkoon, aja pio run -e pera-ota -t upload
[env:pera-ota]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
board_build.partitions = ${common.board_build.partitions}
board_build.filesystem = ${common.board_build.filesystem}
build_flags =
    ${common.build_flags}
    -DMASTO_PERA
upload_protocol = espota
upload_port = 192.168.8.102
upload_flags =
    --auth=susieq_ota
