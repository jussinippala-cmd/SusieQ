<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>SusieQ — Karttaplotteri</title>
<link rel="stylesheet" href="/static/leaflet.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body, #map {
  width: 100%; height: 100%;
  background: #0d1117;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

#info {
  position: fixed;
  bottom: 24px;
  left: 16px;
  z-index: 1000;
  background: rgba(22, 27, 34, 0.82);
  border: 1px solid #30363d;
  border-radius: 10px;
  padding: 12px 16px;
  color: #e6edf3;
  min-width: 130px;
  backdrop-filter: blur(8px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  transition: opacity 0.3s;
}

#info.no-fix { opacity: 0.45; }

#info .lbl {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #6e7681;
  margin-bottom: 1px;
}

#info .sog-val {
  font-size: 26px;
  font-weight: 700;
  color: #f0c04c;
  line-height: 1.1;
}

#info .cog-val {
  font-size: 13px;
  color: #8b949e;
  margin-top: 6px;
}

/* Zoom — ylä-vasen (sijainti #top-left:n kautta) */
#zoom-display {
  background: rgba(22, 27, 34, 0.82);
  border: 1px solid #30363d;
  border-radius: 8px;
  padding: 7px 12px;
  color: #6e7681;
  font-size: 12px;
  backdrop-filter: blur(8px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
#zoom-display span { color: #e6edf3; font-weight: 600; }

.ml-btn {
  background: rgba(22, 27, 34, 0.82); border: 1px solid #30363d; border-radius: 5px;
  color: #e6edf3; font-size: 15px; width: 28px; height: 28px;
  cursor: pointer; padding: 0; line-height: 1; touch-action: manipulation;
  display: flex; align-items: center; justify-content: center;
}
.ml-btn:active { background: #21262d; }

/* Nappi + alusteksti */
.btn-labeled {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.btn-lbl {
  font-size: 9px; color: #6e7681;
  text-transform: uppercase; letter-spacing: 0.06em; user-select: none;
}

/* Toggle-kytkin */
.toggle-switch {
  width: 46px; height: 26px; background: #30363d;
  border-radius: 13px; position: relative; cursor: pointer;
  transition: background 0.2s; flex-shrink: 0; border: 1px solid #484f58;
}
.toggle-switch.on { background: #1f6feb; border-color: #388bfd; }
.toggle-knob {
  width: 20px; height: 20px; background: #6e7681;
  border-radius: 50%; position: absolute; top: 2px; left: 2px;
  transition: left 0.2s, background 0.2s; pointer-events: none;
}
.toggle-switch.on .toggle-knob { left: 22px; background: #fff; }

/* Asetus-rivi (label + toggle) */
.setting-row {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.setting-lbl { font-size: 13px; color: #e6edf3; user-select: none; }

/* Arvorivi (− val +) */
.val-row {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; margin-top: 4px;
}
#ml-val, #alert-val {
  color: #f0c04c; font-weight: 600; min-width: 40px; text-align: center; font-size: 13px;
}

/* Pysyvät napit ala-oikea */
#persistent-btns {
  position: fixed; bottom: 24px; right: 16px;
  z-index: 1001; display: flex; flex-direction: row; align-items: center; gap: 8px;
}

/* Asetuspaneeli */
#settings-panel {
  position: fixed; bottom: 100px; right: 16px;
  z-index: 1000; display: none;
}
#settings-panel.open { display: block; }

.settings-card {
  background: rgba(22, 27, 34, 0.82); border: 1px solid #30363d;
  border-radius: 12px; padding: 12px 14px;
  backdrop-filter: blur(8px); box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  display: flex; flex-direction: column; gap: 10px; min-width: 210px;
}

.action-row { display: flex; flex-direction: row; gap: 12px; justify-content: center; }

.settings-sep { height: 1px; background: #30363d; }

/* WP-tila vihje */
#wp-hint {
  display: none;
  position: fixed; top: 56px; left: 50%; transform: translateX(-50%);
  z-index: 2000;
  background: rgba(255,107,107,0.92); color: #fff;
  padding: 7px 16px; border-radius: 8px; font-size: 13px;
  white-space: nowrap; pointer-events: none;
  backdrop-filter: blur(4px);
}

.ctrl-btn {
  background: rgba(22, 27, 34, 0.82);
  border: 1px solid #30363d;
  border-radius: 8px;
  color: #6e7681;
  font-size: 20px;
  width: 44px; height: 44px;
  cursor: pointer;
  backdrop-filter: blur(8px);
  touch-action: manipulation;
  text-align: center;
  line-height: 1;
  padding: 0;
}

.ctrl-btn:active { background: #21262d; color: #e6edf3; }
.ctrl-btn.active { border-color: #ff6b6b; color: #ff6b6b; }
.ctrl-btn.out-of-range { border-color: #ff6b6b; color: #ff6b6b; opacity: 0.5; }
.ctrl-btn.disabled { opacity: 0.35; }
.ctrl-btn.hidden { display: none; }

.leaflet-tile-pane { filter: brightness(0.82) contrast(1.08) saturate(0.9); }

/* Karilleajovaroitus */
#grounding-alert {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 3000;
  background: #ff6b6b;
  color: #fff;
  text-align: center;
  padding: 14px;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.05em;
  animation: gpulse 0.8s ease-in-out infinite alternate;
}
@keyframes gpulse { from { opacity: 0.75; } to { opacity: 1; } }

/* Ylä-vasen ryhmä */
#top-left {
  position: fixed;
  top: 16px; left: 16px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
</style>
</head>
<body>

<div id="map"></div>

<div id="info" class="no-fix">
  <div class="lbl">Nopeus</div>
  <div class="sog-val" id="sog">—</div>
  <div class="cog-val" id="cog">Ei GPS-lukemaa</div>
</div>

<div id="grounding-alert">⚠ Karilleajovaara</div>

<div id="top-left">
  <div id="zoom-display">Z:<span id="zoom-val">13</span></div>
</div>

<div id="wp-hint">📍 Napauta karttaa</div>

<div id="settings-panel">
  <div class="settings-card">
    <div class="action-row">
      <div class="btn-labeled">
        <button class="ctrl-btn" id="btn-add-wp" onclick="toggleWpAddMode()">📍</button>
        <span class="btn-lbl">Lisää WP</span>
      </div>
      <div class="btn-labeled">
        <button class="ctrl-btn" id="btn-start-route" onclick="startRoute()">▶</button>
        <span class="btn-lbl">Aloita</span>
      </div>
      <div class="btn-labeled">
        <button class="ctrl-btn" onclick="clearRoute()">🗑</button>
        <span class="btn-lbl">Reitti</span>
      </div>
    </div>
    <div class="settings-sep"></div>
    <div class="action-row" style="justify-content:flex-start">
      <div class="btn-labeled">
        <button class="ctrl-btn" onclick="clearTrack()" style="width:36px;height:36px;font-size:14px">🗑</button>
        <span class="btn-lbl">GPS-jälki</span>
      </div>
    </div>
    <div class="settings-sep"></div>
    <div class="setting-row">
      <span class="setting-lbl">Automaattiohitus</span>
      <div class="toggle-switch on" id="toggle-autoadvance" onclick="toggleAutoAdvance()"><div class="toggle-knob"></div></div>
    </div>
    <div class="val-row">
      <button class="ml-btn" onclick="changeAdvanceRadius(-1)">−</button>
      <span id="advance-val">0.10 nm</span>
      <button class="ml-btn" onclick="changeAdvanceRadius(1)">+</button>
    </div>
    <div class="settings-sep"></div>
    <div class="setting-row">
      <span class="setting-lbl">Seuraa</span>
      <div class="toggle-switch" id="toggle-follow" onclick="toggleFollow()"><div class="toggle-knob"></div></div>
    </div>
    <div class="settings-sep"></div>
    <div class="setting-row">
      <span class="setting-lbl">Minuuttiviiva</span>
      <div class="toggle-switch on" id="toggle-ml" onclick="onMlToggle()"><div class="toggle-knob"></div></div>
    </div>
    <div class="val-row">
      <button class="ml-btn" onclick="changeMl(-1)">−</button>
      <span id="ml-val">5 min</span>
      <button class="ml-btn" onclick="changeMl(1)">+</button>
    </div>
    <div class="settings-sep"></div>
    <div class="setting-row">
      <span class="setting-lbl">Ääni</span>
      <div class="toggle-switch" id="toggle-sound" onclick="toggleSound()"><div class="toggle-knob"></div></div>
    </div>
    <div class="settings-sep"></div>
    <div class="setting-row">
      <span class="setting-lbl">Hälytys</span>
      <div class="toggle-switch on" id="toggle-alert" onclick="toggleAlertEnabled()"><div class="toggle-knob"></div></div>
    </div>
    <div class="val-row">
      <button class="ml-btn" onclick="changeAlertMin(-1)">−</button>
      <span id="alert-val">5 min</span>
      <button class="ml-btn" onclick="changeAlertMin(1)">+</button>
    </div>
  </div>
</div>

<div id="persistent-btns">
  <button class="ctrl-btn" id="btn-center" onclick="centerNow()">🎯</button>
  <button class="ctrl-btn" id="btn-depth" onclick="toggleDepth()">⚓</button>
  <button class="ctrl-btn" id="btn-settings" onclick="toggleSettings()">⚙</button>
</div>

<script src="/static/leaflet.min.js"></script>
<script>
const HOME = [61.515544, 23.790427];
const TRACK_KEY = 'susieq_track';
const MAX_PTS = 5000;

// ── Kartta ──────────────────────────────────────────────────────────────────
const map = L.map('map', {
  zoomControl: false, attributionControl: true, tap: true, doubleClickZoom: false
}).setView(HOME, 13);

const osmLayer = L.tileLayer('/tiles/osm/{z}/{x}/{y}.png', {
  maxZoom: 18, attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a>'
}).addTo(map);

const seamarkLayer = L.tileLayer('/tiles/seamark/{z}/{x}/{y}.png', {
  maxZoom: 18, opacity: 0.75,
  attribution: '© <a href="https://openseamap.org">OpenSeaMap</a>'
}).addTo(map);

// Merikarttasarja N — syvyysdata (Traficom WMTS, zoom 10-15)
const depthLayer = L.tileLayer('/tiles/merik/{z}/{x}/{y}.png', {
  minZoom: 10, maxZoom: 15, opacity: 0.9,
  attribution: '© <a href="https://traficom.fi">Traficom</a>'
});
let depthVisible = false;

// ── Track + localStorage ─────────────────────────────────────────────────────
const track = L.polyline([], { color: '#4fc3f7', weight: 2.5, opacity: 0.8 }).addTo(map);
let lastLatLng = null;
let firstFix = true;

(function loadTrack() {
  try {
    const saved = localStorage.getItem(TRACK_KEY);
    if (!saved) return;
    const pts = JSON.parse(saved);
    if (pts.length) { track.setLatLngs(pts); lastLatLng = pts[pts.length - 1]; }
  } catch(e) { localStorage.removeItem(TRACK_KEY); }
})();

function saveTrack() {
  const pts = track.getLatLngs();
  if (!pts.length) { localStorage.removeItem(TRACK_KEY); return; }
  try {
    localStorage.setItem(TRACK_KEY,
      JSON.stringify(pts.slice(-MAX_PTS).map(p => [p.lat, p.lng])));
  } catch(e) {}
}

setInterval(saveTrack, 30000);
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'hidden') saveTrack();
});

function clearTrack() {
  if (!confirm('Tyhjennetäänkö GPS-jälki?')) return;
  track.setLatLngs([]);
  lastLatLng = null;
  localStorage.removeItem(TRACK_KEY);
  closeSettings();
}

// ── Veneen markeri ───────────────────────────────────────────────────────────
let boatMarker = null;

function boatIcon(cog) {
  const r = Math.round(cog || 0);
  return L.divIcon({
    className: '',
    html: `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="30" viewBox="0 0 22 30"
               style="transform:rotate(${r}deg);transform-origin:50% 50%;
                      filter:drop-shadow(0 0 5px rgba(240,192,76,0.55))">
             <polygon points="11,2 20,28 11,21 2,28" fill="#f0c04c" stroke="#161b22" stroke-width="1.5"/>
           </svg>`,
    iconSize: [22, 30], iconAnchor: [11, 15]
  });
}

function updateBoat(lat, lon, cog) {
  const pos = [lat, lon];
  if (!boatMarker) {
    boatMarker = L.marker(pos, { icon: boatIcon(cog), zIndexOffset: 1000 }).addTo(map);
  } else {
    boatMarker.setLatLng(pos);
    boatMarker.setIcon(boatIcon(cog));
  }
  currentPos = pos;
  if (firstFix) { map.setView(pos, 14); firstFix = false; }
  else if (autoFollow && Date.now() - lastInteraction > FOLLOW_DELAY) {
    map.setView(pos, map.getZoom());
  }
  const moved = !lastLatLng ||
    Math.hypot(lastLatLng[0] - lat, lastLatLng[1] - lon) > 0.00005;
  if (moved) { track.addLatLng(pos); lastLatLng = pos; }
}

// ── Minuuttiviiva ────────────────────────────────────────────────────────────
let minuteLine = null;
let mlEnabled = true;
let mlMinutes = 5;

function onMlToggle() {
  mlEnabled = !mlEnabled;
  if (!mlEnabled && minuteLine) { minuteLine.remove(); minuteLine = null; }
  document.getElementById('toggle-ml').classList.toggle('on', mlEnabled);
}

function changeMl(delta) {
  mlMinutes = Math.min(60, Math.max(1, mlMinutes + delta));
  document.getElementById('ml-val').textContent = mlMinutes + ' min';
}

function projectPos(lat, lon, cogDeg, sogKn, mins) {
  const d = sogKn * mins / 60 * 1852;
  const cr = cogDeg * Math.PI / 180;
  const lr = lat * Math.PI / 180;
  return [lat + d * Math.cos(cr) / 111320,
          lon + d * Math.sin(cr) / (111320 * Math.cos(lr))];
}

function updateMinuteLine(lat, lon, cog, sog) {
  if (!mlEnabled || sog < 0.2) {
    if (minuteLine) { minuteLine.remove(); minuteLine = null; }
    return;
  }
  const end = projectPos(lat, lon, cog, sog, mlMinutes);
  if (!minuteLine) {
    minuteLine = L.polyline([[lat, lon], end], {
      color: '#f0c04c', weight: 2, opacity: 0.85, dashArray: '8 5'
    }).addTo(map);
  } else {
    minuteLine.setLatLngs([[lat, lon], end]);
  }
}

// ── Keskitä / Seuraa ─────────────────────────────────────────────────────────
let autoFollow = false;
let lastInteraction = 0;
let currentPos = null;
const FOLLOW_DELAY = 20000;

map.on('dragstart zoomstart', function() {
  lastInteraction = Date.now();
});

function centerNow() {
  if (!currentPos) return;
  map.setView(currentPos, map.getZoom());
  lastInteraction = 0;
}

function toggleFollow() {
  autoFollow = !autoFollow;
  document.getElementById('toggle-follow').classList.toggle('on', autoFollow);
  if (autoFollow && currentPos) centerNow();
}

function toggleDepth() {
  depthVisible = !depthVisible;
  if (depthVisible) {
    osmLayer.remove();
    seamarkLayer.remove();
    depthLayer.addTo(map);
  } else {
    depthLayer.remove();
    osmLayer.addTo(map);
    seamarkLayer.addTo(map);
  }
  document.getElementById('btn-depth').classList.toggle('active', depthVisible);
  updateDepthBtnState();
}

function updateDepthBtnState() {
  const z = map.getZoom();
  const btn = document.getElementById('btn-depth');
  const inRange = z >= 10 && z <= 15;
  btn.classList.toggle('out-of-range', !inRange);
}

// ── Settings ─────────────────────────────────────────────────────────────────
function toggleSettings() {
  document.getElementById('settings-panel').classList.toggle('open');
}
function closeSettings() {
  document.getElementById('settings-panel').classList.remove('open');
}

document.addEventListener('pointerdown', function(e) {
  const panel = document.getElementById('settings-panel');
  const btn = document.getElementById('btn-settings');
  if (panel.classList.contains('open') &&
      !panel.contains(e.target) && !btn.contains(e.target)) {
    closeSettings();
  }
});

let _tapCount = 0, _tapTimer = null;
map.on('click', function(e) {
  _tapCount++;
  clearTimeout(_tapTimer);
  _tapTimer = setTimeout(function() {
    if (_tapCount === 2) map.zoomIn(1);
    else if (_tapCount >= 3) map.zoomOut(1);
    _tapCount = 0;
  }, 200);
});

function bearing(lat1, lon1, lat2, lon2) {
  const dL = (lon2 - lon1) * Math.PI / 180;
  const l1 = lat1 * Math.PI / 180, l2 = lat2 * Math.PI / 180;
  return (Math.atan2(Math.sin(dL) * Math.cos(l2),
    Math.cos(l1) * Math.sin(l2) - Math.sin(l1) * Math.cos(l2) * Math.cos(dL))
    * 180 / Math.PI + 360) % 360;
}

function distNm(lat1, lon1, lat2, lon2) {
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 +
    Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return 3440.065 * 2 * Math.asin(Math.sqrt(a));
}

// ── Info ─────────────────────────────────────────────────────────────────────
function updateInfo(gps) {
  const info = document.getElementById('info');
  if (!gps || !gps.fix) {
    info.classList.add('no-fix');
    document.getElementById('sog').textContent = '—';
    document.getElementById('cog').textContent = 'Ei GPS-lukemaa';
    return;
  }
  info.classList.remove('no-fix');
  document.getElementById('sog').textContent =
    (gps.sog_knots != null ? gps.sog_knots.toFixed(1) : '—') + ' kn';
  document.getElementById('cog').textContent =
    'Suunta: ' + (gps.cog_deg != null ? Math.round(gps.cog_deg) + '°' : '—');
}

// ── Route stubs (implementoitu Task 3–6:ssa) ───────────────────────────────
function toggleWpAddMode() {}
function startRoute() {}
function clearRoute() {}
function toggleAutoAdvance() {}
function changeAdvanceRadius(delta) {}

// ── GPS poll ─────────────────────────────────────────────────────────────────
async function pollGPS() {
  try {
    const r = await fetch('/gps');
    if (!r.ok) return;
    const gps = await r.json();
    updateInfo(gps);
    if (gps.fix && gps.lat != null && gps.lon != null) {
      const { lat, lon } = gps;
      const cog = gps.cog_deg || 0, sog = gps.sog_knots || 0;
      updateBoat(lat, lon, cog);
      updateMinuteLine(lat, lon, cog, sog);
      if (sog > 0.5 && alertEnabled) {
        const [pLat, pLon] = projectPos(lat, lon, cog, sog, alertMinutes);
        showGroundingAlert(!inLake(pLat, pLon));
      } else {
        showGroundingAlert(false);
      }
    }
  } catch (_) {}
}

setInterval(pollGPS, 2000);
pollGPS();

map.on('zoomend', function() {
  document.getElementById('zoom-val').textContent = map.getZoom();
  updateDepthBtnState();
});
updateDepthBtnState();

// ── Karilleajovaroitus ───────────────────────────────────────────────────────
let lakeRings = [];
let groundingActive = false;
let alertEnabled = true;
let alertMinutes = 5;

function toggleAlertEnabled() {
  alertEnabled = !alertEnabled;
  document.getElementById('toggle-alert').classList.toggle('on', alertEnabled);
  if (!alertEnabled) showGroundingAlert(false);
}

function changeAlertMin(delta) {
  alertMinutes = Math.min(10, Math.max(1, alertMinutes + delta));
  document.getElementById('alert-val').textContent = alertMinutes + ' min';
}

fetch('/static/nasijärvi.geojson')
  .then(r => r.json())
  .then(gj => {
    for (const feat of gj.features) {
      const geom = feat.geometry;
      const polys = geom.type === 'MultiPolygon' ? geom.coordinates : [geom.coordinates];
      for (const poly of polys) {
        const outer = poly[0].map(c => [c[1], c[0]]);
        const holes = poly.slice(1).map(h => h.map(c => [c[1], c[0]]));
        lakeRings.push({ outer, holes });
      }
    }
  })
  .catch(() => {});

function pointInRing(lat, lon, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [lati, loni] = ring[i], [latj, lonj] = ring[j];
    if ((loni > lon) !== (lonj > lon) &&
        lat < (latj - lati) * (lon - loni) / (lonj - loni) + lati)
      inside = !inside;
  }
  return inside;
}

function inLake(lat, lon) {
  if (!lakeRings.length) return true;
  for (const { outer, holes } of lakeRings) {
    if (!pointInRing(lat, lon, outer)) continue;
    if (holes.some(h => pointInRing(lat, lon, h))) continue;
    return true;
  }
  return false;
}

function showGroundingAlert(danger) {
  if (danger === groundingActive) return;
  groundingActive = danger;
  document.getElementById('grounding-alert').style.display = danger ? 'block' : 'none';
  if (danger) playBeep();
}

// ── Hälytysääni ──────────────────────────────────────────────────────────────
let audioCtx = null;
let soundEnabled = false;

function toggleSound() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  soundEnabled = !soundEnabled;
  document.getElementById('toggle-sound').classList.toggle('on', soundEnabled);
}

function playBeep() {
  if (!audioCtx || !soundEnabled) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.frequency.value = 880;
  gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
  osc.start(); osc.stop(audioCtx.currentTime + 0.5);
}
</script>
</body>
</html>
