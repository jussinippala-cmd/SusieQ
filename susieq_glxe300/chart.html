<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>SusieQ — Karttaplotteri</title>
<link rel="stylesheet" href="/static/leaflet.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body, #map {
  width: 100%; height: 100%;
  background: #0d1117;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

#info {
  position: fixed;
  bottom: 24px;
  left: 16px;
  z-index: 1000;
  background: rgba(22, 27, 34, 0.82);
  border: 1px solid #30363d;
  border-radius: 10px;
  padding: 12px 16px;
  color: #e6edf3;
  min-width: 130px;
  backdrop-filter: blur(8px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  transition: opacity 0.3s;
}

#info.no-fix { opacity: 0.45; }

#wind-widget {
  position: fixed;
  bottom: 120px; left: 16px;
  z-index: 1000;
  background: rgba(22, 27, 34, 0.82);
  border: 1px solid #30363d;
  border-radius: 10px;
  padding: 8px 10px;
  min-width: 130px;
  backdrop-filter: blur(8px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
#wind-widget .lbl { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:#6e7681; margin-bottom:2px; }
#wind-speed-val   { font-size:18px; font-weight:700; color:#58a6ff; line-height:1.1; }
#wind-bft-val     { font-size:11px; color:#8b949e; }

#info .lbl {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #6e7681;
  margin-bottom: 1px;
}

#info .sog-val {
  font-size: 26px;
  font-weight: 700;
  color: #f0c04c;
  line-height: 1.1;
}

#info .cog-val {
  font-size: 13px;
  color: #8b949e;
  margin-top: 6px;
}

/* Zoom — ylä-vasen (sijainti #top-left:n kautta) */
#zoom-display {
  background: rgba(22, 27, 34, 0.82);
  border: 1px solid #30363d;
  border-radius: 8px;
  padding: 7px 12px;
  color: #6e7681;
  font-size: 12px;
  backdrop-filter: blur(8px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
#zoom-display span { color: #e6edf3; font-weight: 600; }

.ml-btn {
  background: rgba(22, 27, 34, 0.82); border: 1px solid #30363d; border-radius: 5px;
  color: #e6edf3; font-size: 15px; width: 28px; height: 28px;
  cursor: pointer; padding: 0; line-height: 1; touch-action: manipulation;
  display: flex; align-items: center; justify-content: center;
}
.ml-btn:active { background: #21262d; }

/* Nappi + alusteksti */
.btn-labeled {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.btn-lbl {
  font-size: 9px; color: #6e7681;
  text-transform: uppercase; letter-spacing: 0.06em; user-select: none;
}

/* Toggle-kytkin */
.toggle-switch {
  width: 46px; height: 26px; background: #30363d;
  border-radius: 13px; position: relative; cursor: pointer;
  transition: background 0.2s; flex-shrink: 0; border: 1px solid #484f58;
}
.toggle-switch.on { background: #1f6feb; border-color: #388bfd; }
.toggle-knob {
  width: 20px; height: 20px; background: #6e7681;
  border-radius: 50%; position: absolute; top: 2px; left: 2px;
  transition: left 0.2s, background 0.2s; pointer-events: none;
}
.toggle-switch.on .toggle-knob { left: 22px; background: #fff; }

/* Asetus-rivi (label + toggle) */
.setting-row {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.setting-lbl { font-size: 13px; color: #e6edf3; user-select: none; }

/* Arvorivi (− val +) */
.val-row {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; margin-top: 4px;
}
#ml-val, #alert-val, #advance-val, #anchor-radius-val {
  color: #f0c04c; font-weight: 600; min-width: 40px; text-align: center; font-size: 13px;
}

/* Pysyvät napit ala-oikea */
#persistent-btns {
  position: fixed; bottom: 24px; right: 16px;
  z-index: 1001; display: flex; flex-direction: row; align-items: center; gap: 8px;
}

/* Asetuspaneeli */
#settings-panel {
  position: fixed; bottom: 100px; right: 16px;
  z-index: 1000; display: none;
}
#settings-panel.open { display: block; }

.settings-card {
  background: rgba(22, 27, 34, 0.82); border: 1px solid #30363d;
  border-radius: 12px; padding: 12px 14px;
  backdrop-filter: blur(8px); box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  display: flex; flex-direction: column; gap: 10px; min-width: 210px;
  max-height: calc(100dvh - 130px); overflow-y: auto;
  overscroll-behavior: contain;
}

.action-row { display: flex; flex-direction: row; gap: 12px; justify-content: center; }

.settings-sep { height: 1px; background: #30363d; }

/* WP-tila vihje */
#wp-hint {
  display: none;
  position: fixed; top: 56px; left: 50%; transform: translateX(-50%);
  z-index: 2000;
  background: rgba(255,107,107,0.92); color: #fff;
  padding: 7px 16px; border-radius: 8px; font-size: 13px;
  white-space: nowrap; pointer-events: none;
  backdrop-filter: blur(4px);
}

.ctrl-btn {
  background: rgba(22, 27, 34, 0.82);
  border: 1px solid #30363d;
  border-radius: 8px;
  color: #6e7681;
  font-size: 20px;
  width: 44px; height: 44px;
  cursor: pointer;
  backdrop-filter: blur(8px);
  touch-action: manipulation;
  text-align: center;
  line-height: 1;
  padding: 0;
}

.ctrl-btn:active { background: #21262d; color: #e6edf3; }
.ctrl-btn.active { border-color: #ff6b6b; color: #ff6b6b; }
.ctrl-btn.out-of-range { border-color: #ff6b6b; color: #ff6b6b; opacity: 0.5; }
.ctrl-btn.disabled { opacity: 0.35; }
.ctrl-btn.hidden { display: none; }

.leaflet-tile-pane { filter: brightness(0.82) contrast(1.08) saturate(0.9); }

/* Karilleajovaroitus */
#grounding-alert {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 3000;
  background: #ff6b6b;
  color: #fff;
  text-align: center;
  padding: 14px;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.05em;
  animation: gpulse 0.8s ease-in-out infinite alternate;
}
@keyframes gpulse { from { opacity: 0.75; } to { opacity: 1; } }

/* Ylä-vasen ryhmä */
#top-left {
  position: fixed;
  top: 16px; left: 16px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* Reittipaneeli */
#route-panel {
  position: fixed;
  top: 56px; left: 16px;
  max-height: calc(100dvh - 170px);
  width: 160px;
  z-index: 1000;
  background: rgba(22, 27, 34, 0.92);
  border: 1px solid #30363d;
  border-radius: 10px;
  display: none;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}

#route-panel-header {
  padding: 8px 10px;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #6e7681;
  border-bottom: 1px solid #30363d;
  flex-shrink: 0;
}

#route-wp-list {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 4px 0;
}

.route-wp-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 8px;
  border-left: 2px solid transparent;
}

.route-wp-row.active {
  background: rgba(255, 107, 107, 0.08);
  border-left-color: #ff6b6b;
}

.route-wp-row.done { opacity: 0.4; }

.route-wp-num {
  width: 18px; height: 18px;
  border-radius: 50%;
  border: 1.5px solid #484f58;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: #6e7681;
  flex-shrink: 0;
}

.route-wp-row.active .route-wp-num {
  border-color: #ff6b6b; color: #ff6b6b; font-weight: bold;
}

.route-wp-info { flex: 1; min-width: 0; }

.route-wp-name {
  display: block;
  font-size: 11px;
  color: #e6edf3;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.route-wp-row.done .route-wp-name {
  text-decoration: line-through; color: #6e7681;
}

.route-wp-dist {
  display: block;
  font-size: 10px;
  color: #8b949e;
  margin-top: 1px;
}

.route-wp-row.active .route-wp-dist { color: #ff6b6b; }

.route-wp-del {
  background: none; border: none;
  color: #484f58; font-size: 11px;
  cursor: pointer; padding: 2px 4px;
  flex-shrink: 0;
  line-height: 1;
}
.route-wp-del:hover { color: #ff6b6b; }

#route-next-btn {
  display: none;
  width: calc(100% - 16px);
  margin: 0 8px 6px;
  background: #21262d;
  border: 1px solid #30363d;
  border-radius: 6px;
  color: #e6edf3;
  font-size: 11px;
  padding: 5px;
  cursor: pointer;
  flex-shrink: 0;
}
#route-next-btn:disabled { opacity: 0.35; cursor: default; }

#route-total {
  padding: 8px 10px;
  border-top: 1px solid #30363d;
  background: rgba(13, 17, 23, 0.5);
  flex-shrink: 0;
}

#route-total .lbl {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #6e7681;
  margin-bottom: 3px;
}

#route-total-dist {
  font-size: 12px;
  color: #e6edf3;
  font-weight: 600;
}

#route-total-eta {
  font-size: 10px;
  color: #8b949e;
  margin-top: 2px;
}
</style>
</head>
<body>

<div id="map"></div>

<div id="info" class="no-fix">
  <div class="lbl">Nopeus</div>
  <div class="sog-val" id="sog">—</div>
  <div class="cog-val" id="cog">Ei GPS-lukemaa</div>
</div>

<div id="wind-widget">
  <div class="lbl">Tuuli</div>
  <svg viewBox="0 0 280 280" width="96" height="96">
    <circle cx="140" cy="140" r="130" fill="#1a1f27" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="140" cy="140" r="108" fill="#161b22"/>
    <!-- No-go-sektori ±40° kuolleesta vastatuulesta — kiinteä, ei pyöri -->
    <path d="M 140 140 L 76 63 A 100 100 0 0 1 204 63 Z"
          fill="#f85149" fill-opacity="0.32"
          stroke="#f85149" stroke-opacity="0.7" stroke-width="1.5"/>
    <g id="wind-ticks-small"></g>
    <g id="wind-arrow-small">
      <polygon points="140,42 120,2 160,2" fill="#58a6ff" opacity="0.95"/>
    </g>
    <circle cx="140" cy="140" r="4" fill="#30363d"/>
  </svg>
  <div id="wind-speed-val">— m/s</div>
  <div id="wind-bft-val">—</div>
</div>

<div id="grounding-alert">⚠ Karilleajovaara</div>

<div id="top-left">
  <div id="zoom-display">Z:<span id="zoom-val">13</span></div>
</div>

<div id="wp-hint">📍 Napauta karttaa</div>

<div id="settings-panel">
  <div class="settings-card">
    <div class="action-row">
      <div class="btn-labeled">
        <button class="ctrl-btn" id="btn-add-wp" onclick="toggleWpAddMode()">📍</button>
        <span class="btn-lbl">Lisää WP</span>
      </div>
      <div class="btn-labeled">
        <button class="ctrl-btn" id="btn-start-route" onclick="startRoute()">▶</button>
        <span class="btn-lbl">Aloita</span>
      </div>
      <div class="btn-labeled">
        <button class="ctrl-btn" onclick="clearRoute()">🗑</button>
        <span class="btn-lbl">Reitti</span>
      </div>
    </div>
    <div class="settings-sep"></div>
    <div class="action-row" style="justify-content:flex-start">
      <div class="btn-labeled">
        <button class="ctrl-btn" onclick="clearTrack()" style="width:36px;height:36px;font-size:14px">🗑</button>
        <span class="btn-lbl">GPS-jälki</span>
      </div>
    </div>
    <div class="settings-sep"></div>
    <div class="setting-row">
      <span class="setting-lbl">Automaattiohitus</span>
      <div class="toggle-switch on" id="toggle-autoadvance" onclick="toggleAutoAdvance()"><div class="toggle-knob"></div></div>
    </div>
    <div class="val-row">
      <button class="ml-btn" onclick="changeAdvanceRadius(-1)">−</button>
      <span id="advance-val">0.10 nm</span>
      <button class="ml-btn" onclick="changeAdvanceRadius(1)">+</button>
    </div>
    <div class="settings-sep"></div>
    <div class="setting-row">
      <span class="setting-lbl">Ankkurivahti</span>
      <div class="toggle-switch" id="toggle-anchor" onclick="toggleAnchorWatch()"><div class="toggle-knob"></div></div>
    </div>
    <div class="val-row">
      <button class="ml-btn" onclick="changeAnchorRadius(-1)">−</button>
      <span id="anchor-radius-val">50 m</span>
      <button class="ml-btn" onclick="changeAnchorRadius(1)">+</button>
    </div>
    <div class="settings-sep"></div>
    <div class="setting-row">
      <span class="setting-lbl">Seuraa</span>
      <div class="toggle-switch" id="toggle-follow" onclick="toggleFollow()"><div class="toggle-knob"></div></div>
    </div>
    <div class="settings-sep"></div>
    <div class="setting-row">
      <span class="setting-lbl">Minuuttiviiva</span>
      <div class="toggle-switch on" id="toggle-ml" onclick="onMlToggle()"><div class="toggle-knob"></div></div>
    </div>
    <div class="val-row">
      <button class="ml-btn" onclick="changeMl(-1)">−</button>
      <span id="ml-val">5 min</span>
      <button class="ml-btn" onclick="changeMl(1)">+</button>
    </div>
    <div class="settings-sep"></div>
    <div class="setting-row">
      <span class="setting-lbl">Ääni</span>
      <div class="toggle-switch" id="toggle-sound" onclick="toggleSound()"><div class="toggle-knob"></div></div>
    </div>
    <div class="settings-sep"></div>
    <div class="setting-row">
      <span class="setting-lbl">Hälytys</span>
      <div class="toggle-switch on" id="toggle-alert" onclick="toggleAlertEnabled()"><div class="toggle-knob"></div></div>
    </div>
    <div class="val-row">
      <button class="ml-btn" onclick="changeAlertMin(-1)">−</button>
      <span id="alert-val">5 min</span>
      <button class="ml-btn" onclick="changeAlertMin(1)">+</button>
    </div>
  </div>
</div>

<div id="route-panel">
  <div id="route-panel-header">Reitti</div>
  <div id="route-wp-list"></div>
  <button id="route-next-btn" onclick="advanceToNextWp()">▶ Seuraava</button>
  <div id="route-total">
    <div class="lbl">Koko reitti</div>
    <div id="route-total-dist">—</div>
    <div id="route-total-eta">—</div>
  </div>
</div>

<div id="persistent-btns">
  <button class="ctrl-btn" id="btn-center" onclick="centerNow()">🎯</button>
  <button class="ctrl-btn" id="btn-depth" onclick="toggleDepth()">⚓</button>
  <button class="ctrl-btn" id="btn-settings" onclick="toggleSettings()">⚙</button>
</div>

<script src="/static/leaflet.min.js"></script>
<script>
const HOME = [61.515544, 23.790427];
const TRACK_KEY = 'susieq_track';
const MAX_PTS = 5000;

// ── Kartta ──────────────────────────────────────────────────────────────────
const map = L.map('map', {
  zoomControl: false, attributionControl: true, tap: true, doubleClickZoom: false
}).setView(HOME, 13);

const osmLayer = L.tileLayer('/tiles/osm/{z}/{x}/{y}.png', {
  maxZoom: 18, attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a>'
}).addTo(map);

const seamarkLayer = L.tileLayer('/tiles/seamark/{z}/{x}/{y}.png', {
  maxZoom: 18, opacity: 0.75,
  attribution: '© <a href="https://openseamap.org">OpenSeaMap</a>'
}).addTo(map);

// Merikarttasarja N — syvyysdata (Traficom WMTS, zoom 10-15)
const depthLayer = L.tileLayer('/tiles/merik/{z}/{x}/{y}.png', {
  minZoom: 10, maxZoom: 15, opacity: 0.9,
  attribution: '© <a href="https://traficom.fi">Traficom</a>'
});
let depthVisible = false;

// ── Track + localStorage ─────────────────────────────────────────────────────
const track = L.polyline([], { color: '#4ade80', weight: 2.5, opacity: 0.85 }).addTo(map);
let lastLatLng = null;
let firstFix = true;

(function loadTrack() {
  try {
    const saved = localStorage.getItem(TRACK_KEY);
    if (!saved) return;
    const pts = JSON.parse(saved);
    if (pts.length) { track.setLatLngs(pts); lastLatLng = pts[pts.length - 1]; }
  } catch(e) { localStorage.removeItem(TRACK_KEY); }
})();

function saveTrack() {
  const pts = track.getLatLngs();
  if (!pts.length) { localStorage.removeItem(TRACK_KEY); return; }
  try {
    localStorage.setItem(TRACK_KEY,
      JSON.stringify(pts.slice(-MAX_PTS).map(p => [p.lat, p.lng])));
  } catch(e) {}
}

setInterval(saveTrack, 30000);
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'hidden') saveTrack();
});

function clearTrack() {
  if (!confirm('Tyhjennetäänkö GPS-jälki?')) return;
  track.setLatLngs([]);
  lastLatLng = null;
  localStorage.removeItem(TRACK_KEY);
  closeSettings();
}

// ── Veneen markeri ───────────────────────────────────────────────────────────
let boatMarker = null;

function boatIcon(cog) {
  const r = Math.round(cog || 0);
  return L.divIcon({
    className: '',
    html: `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="30" viewBox="0 0 22 30"
               style="transform:rotate(${r}deg);transform-origin:50% 50%;
                      filter:drop-shadow(0 0 5px rgba(240,192,76,0.55))">
             <polygon points="11,2 20,28 11,21 2,28" fill="#f0c04c" stroke="#161b22" stroke-width="1.5"/>
           </svg>`,
    iconSize: [22, 30], iconAnchor: [11, 15]
  });
}

function updateBoat(lat, lon, cog) {
  const pos = [lat, lon];
  if (!boatMarker) {
    boatMarker = L.marker(pos, { icon: boatIcon(cog), zIndexOffset: 1000 }).addTo(map);
  } else {
    boatMarker.setLatLng(pos);
    boatMarker.setIcon(boatIcon(cog));
  }
  currentPos = pos;
  if (firstFix) { map.setView(pos, 14); firstFix = false; }
  else if (autoFollow && Date.now() - lastInteraction > FOLLOW_DELAY) {
    map.setView(pos, map.getZoom());
  }
  const moved = !lastLatLng ||
    Math.hypot(lastLatLng[0] - lat, lastLatLng[1] - lon) > 0.00005;
  if (moved) { track.addLatLng(pos); lastLatLng = pos; }
}

// ── Minuuttiviiva ────────────────────────────────────────────────────────────
let minuteLine = null;
let minuteLabels = [];
let mlEnabled = true;
let mlMinutes = 5;

function clearMinuteLine() {
  if (minuteLine) { minuteLine.remove(); minuteLine = null; }
  minuteLabels.forEach(m => m.remove());
  minuteLabels = [];
}

function onMlToggle() {
  mlEnabled = !mlEnabled;
  if (!mlEnabled) clearMinuteLine();
  document.getElementById('toggle-ml').classList.toggle('on', mlEnabled);
}

function changeMl(delta) {
  mlMinutes = Math.min(60, Math.max(1, mlMinutes + delta));
  document.getElementById('ml-val').textContent = mlMinutes + ' min';
}

function projectPos(lat, lon, cogDeg, sogKn, mins) {
  const d = sogKn * mins / 60 * 1852;
  const cr = cogDeg * Math.PI / 180;
  const lr = lat * Math.PI / 180;
  return [lat + d * Math.cos(cr) / 111320,
          lon + d * Math.sin(cr) / (111320 * Math.cos(lr))];
}

function updateMinuteLine(lat, lon, cog, sog) {
  if (!mlEnabled || sog < 0.2) {
    clearMinuteLine();
    return;
  }
  const end = projectPos(lat, lon, cog, sog, mlMinutes);
  if (!minuteLine) {
    minuteLine = L.polyline([[lat, lon], end], {
      color: '#ff9800', weight: 2.5, opacity: 0.9, dashArray: '8 5'
    }).addTo(map);
  } else {
    minuteLine.setLatLngs([[lat, lon], end]);
  }

  minuteLabels.forEach(m => m.remove());
  minuteLabels = [];
  for (let t = 5; t <= mlMinutes; t += 5) {
    const pos = projectPos(lat, lon, cog, sog, t);
    const lbl = L.marker(pos, {
      icon: L.divIcon({
        className: '',
        html: `<span style="
          display:inline-block;
          background:rgba(22,27,34,0.8);
          color:#ff9800;
          font-size:9px;
          font-weight:700;
          padding:1px 4px;
          border-radius:3px;
          border:1px solid rgba(255,152,0,0.5);
          white-space:nowrap;
          pointer-events:none;
          font-family:-apple-system,sans-serif;
        ">${t} min</span>`,
        iconSize: null,
        iconAnchor: [0, 8]
      }),
      interactive: false
    }).addTo(map);
    minuteLabels.push(lbl);
  }
}

// ── Keskitä / Seuraa ─────────────────────────────────────────────────────────
let autoFollow = false;
let lastInteraction = 0;
let currentPos = null;
const FOLLOW_DELAY = 20000;

map.on('dragstart zoomstart', function() {
  lastInteraction = Date.now();
});

function centerNow() {
  if (!currentPos) return;
  map.setView(currentPos, map.getZoom());
  lastInteraction = 0;
}

function toggleFollow() {
  autoFollow = !autoFollow;
  document.getElementById('toggle-follow').classList.toggle('on', autoFollow);
  if (autoFollow && currentPos) centerNow();
}

function toggleDepth() {
  depthVisible = !depthVisible;
  if (depthVisible) {
    osmLayer.remove();
    seamarkLayer.remove();
    depthLayer.addTo(map);

    seamarkLayer.addTo(map);

let _tapCount = 0, _tapTimer = null;
map.on('click', function(e) {

function bearing(lat1, lon1, lat2, lon2) {
  const dL = (lon2 - lon1) * Math.PI / 180;
  const l1 = lat1 * Math.PI / 180, l2 = lat2 * Math.PI / 180;
  return (Math.atan2(Math.sin(dL) * Math.cos(l2),
    Math.cos(l1) * Math.sin(l2) - Math.sin(l1) * Math.cos(l2) * Math.cos(dL))
    * 180 / Math.PI + 360) % 360;
}

function distNm(lat1, lon1, lat2, lon2) {
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 +
    Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return 3440.065 * 2 * Math.asin(Math.sqrt(a));
}

// ── Route ────────────────────────────────────────────────────────────────────
let route = [];           // [{lat, lon}, ...]
let routeActive = false;  // navigointi käynnissä
let currentWpIdx = 0;     // aktiivisen WP:n indeksi
let wpAddMode = false;    // napautustila uuden pisteen lisäämiseen
let advanceRadiusNm = 0.10;
let autoAdvance = true;
let routeMarkers = [];    // L.marker-instanssit kartalla
let routeLine = null;     // L.polyline reittilinjalle
let currentLegLine = null; // viiva veneen sijainnista seuraavaan WP:hen
let _lastSog = 0;         // viimeisin SOG (knots) routePanel-laskentaa varten
let _lastCog = 0;         // viimeisin COG (deg) VMC-laskentaa varten
let _progressBuf = [];    // {t: ms, rem: nm} — jäljellä oleva reittimatka
let _tripSogSum = 0;      // SOG-näytteiden summa reitin aloituksesta
let _tripSogCount = 0;    // SOG-näytteiden määrä reitin aloituksesta

const PROGRESS_WINDOW_MS   = 6 * 60 * 1000; // lähestymisvauhdin ikkuna
const PROGRESS_MIN_SPAN_MS = 60 * 1000;     // minimi-ikkuna ennen tasoitettua ETAa
const TRIP_MIN_SAMPLES     = 30;            // ~60 s @ 2 s pollaus
const MIN_SPEED_KN         = 0.2;           // tämän alle ETA = "—"

// ── Anchor Watch ─────────────────────────────────────────────────────────────
let anchorActive = false;
let anchorLat = null;
let anchorLon = null;
let anchorRadiusM = 50;
let anchorMarker = null;
let anchorCircle = null;

function calcRemainingRoute(lat, lon) {
  if (!routeActive || !route.length || currentWpIdx >= route.length) return null;
  let nm = distNm(lat, lon, route[currentWpIdx].lat, route[currentWpIdx].lon);
  for (let i = currentWpIdx; i < route.length - 1; i++) {
    nm += distNm(route[i].lat, route[i].lon, route[i + 1].lat, route[i + 1].lon);
  }
  return nm;
}

function recordProgress(remNm) {
  const now = Date.now();
  _progressBuf.push({ t: now, rem: remNm });
  while (_progressBuf.length && now - _progressBuf[0].t > PROGRESS_WINDOW_MS)
    _progressBuf.shift();
}

function resetProgress() {
  _progressBuf = [];
}

// Tasoitettu lähestymisvauhti (kn): jäljellä olevan reittimatkan
// lyheneminen puskurin ikkunassa. null jos dataa alle 60 s.
function closingSpeedKn() {
  if (_progressBuf.length < 2) return null;
  const first = _progressBuf[0];
  const last  = _progressBuf[_progressBuf.length - 1];
  const spanMs = last.t - first.t;
  if (spanMs < PROGRESS_MIN_SPAN_MS) return null;
  return (first.rem - last.rem) / (spanMs / 3600000);
}

// Aktiivisen legin ETA-vauhti: tasoitettu jos saatavilla, muuten
// SOG-fallback (kuten vanha laskenta). null = näytä "—".
function activeLegSpeedKn() {
  const cs = closingSpeedKn();
  if (cs === null) return _lastSog > MIN_SPEED_KN ? _lastSog : null;
  return cs >= MIN_SPEED_KN ? cs : null;
}

// Matkan keskivauhti (kn) reitin aloituksesta. null jos dataa alle ~60 s.
function tripAvgSogKn() {
  if (_tripSogCount < TRIP_MIN_SAMPLES) return null;
  return _tripSogSum / _tripSogCount;
}

// Hetkellinen VMC (kn) kohti aktiivista reittipistettä.
// Negatiivinen = etäännytään. null jos ei laskettavissa.
function instantVmcKn(lat, lon) {
  if (!routeActive || currentWpIdx >= route.length) return null;
  if (_lastSog <= MIN_SPEED_KN) return null;
  const wp = route[currentWpIdx];
  const brg = bearing(lat, lon, wp.lat, wp.lon);
  return _lastSog * Math.cos((brg - _lastCog) * Math.PI / 180);
}

function formatEtaMin(m) {
  return m < 60 ? Math.round(m) + ' min' : (m / 60).toFixed(1) + ' h';
}

function updateRoutePanel() {
  const list    = document.getElementById('route-wp-list');
  const distEl  = document.getElementById('route-total-dist');
  const etaEl   = document.getElementById('route-total-eta');
  const nextBtn = document.getElementById('route-next-btn');

  list.innerHTML = '';
  route.forEach((wp, i) => {
    const isDone   = routeActive && i < currentWpIdx;
    const isActive = routeActive && i === currentWpIdx;
    const row = document.createElement('div');
    row.className = 'route-wp-row' +
      (isActive ? ' active' : '') + (isDone ? ' done' : '');

    let distTxt = '';
    if (isActive && currentPos) {
      const d = distNm(currentPos[0], currentPos[1], wp.lat, wp.lon);
      const brg = Math.round(bearing(currentPos[0], currentPos[1], wp.lat, wp.lon)) % 360;
      distTxt = d.toFixed(2) + ' nm · ' + String(brg).padStart(3, '0') + '°';
      if (_lastSog > 0.2) distTxt += '<br>' + Math.round(d / _lastSog * 60) + ' min';
    } else if (i > 0 && (!routeActive || i > currentWpIdx)) {
      distTxt = distNm(route[i-1].lat, route[i-1].lon, wp.lat, wp.lon).toFixed(2) + ' nm';
    }

    row.innerHTML =
      `<span class="route-wp-num">${i + 1}</span>` +
      `<div class="route-wp-info">` +
        `<span class="route-wp-name">WP ${i + 1}</span>` +
        (distTxt ? `<span class="route-wp-dist">${distTxt}</span>` : '') +
      `</div>` +
      `<button class="route-wp-del" onclick="removeRouteWp(${i})">✕</button>`;
    list.appendChild(row);
  });

  if (routeActive && currentPos) {
    const rem = calcRemainingRoute(currentPos[0], currentPos[1]);
    if (rem !== null) {
      distEl.textContent = rem.toFixed(1) + ' nm';
      if (_lastSog > 0.2) {
        const m = rem / _lastSog * 60;
        etaEl.textContent = 'ETA: ' + (m < 60 ? Math.round(m) + ' min' : (m/60).toFixed(1) + ' h');
      } else {
        etaEl.textContent = '—';
      }
    }
  } else if (route.length > 1) {
    let total = 0;
    for (let i = 0; i < route.length - 1; i++)
      total += distNm(route[i].lat, route[i].lon, route[i+1].lat, route[i+1].lon);
    distEl.textContent = total.toFixed(1) + ' nm';
    etaEl.textContent = '—';
  } else {
    distEl.textContent = '—';
    etaEl.textContent = '—';
  }

  nextBtn.style.display = routeActive ? 'block' : 'none';
  nextBtn.disabled = !routeActive || currentWpIdx >= route.length - 1;
  updateCurrentLegLine();
}

function updateCurrentLegLine() {
  if (!routeActive || !currentPos || currentWpIdx >= route.length) {
    if (currentLegLine) { currentLegLine.remove(); currentLegLine = null; }
    return;
  }
  const wp = route[currentWpIdx];
  const pts = [currentPos, [wp.lat, wp.lon]];
  if (!currentLegLine) {
    currentLegLine = L.polyline(pts, {
      color: '#4fc3f7', weight: 2, opacity: 0.65, dashArray: '6 4'
    }).addTo(map);
  } else {
    currentLegLine.setLatLngs(pts);
  }
}

function renderRouteOnMap() {
  routeMarkers.forEach(m => m.remove());
  routeMarkers = [];
  if (routeLine) { routeLine.remove(); routeLine = null; }
  if (currentLegLine) { currentLegLine.remove(); currentLegLine = null; }

  document.getElementById('route-panel').style.display =
    route.length ? 'flex' : 'none';

  if (!route.length) return;

  routeLine = L.polyline(
    route.map(wp => [wp.lat, wp.lon]),
    { color: '#4fc3f7', weight: 2, opacity: 0.65, dashArray: '6 4' }
  ).addTo(map);

  route.forEach((wp, i) => {
    const isActive = routeActive && i === currentWpIdx;
    const isDone   = routeActive && i < currentWpIdx;
    const color    = isActive ? '#ff6b6b' : isDone ? '#484f58' : '#6e7681';
    const bgFill   = isActive ? 'rgba(255,107,107,0.15)' : 'none';
    const sw       = isActive ? 2.5 : 1.8;
    const fw       = isActive ? 'bold' : 'normal';
    const m = L.marker([wp.lat, wp.lon], {
      icon: L.divIcon({
        className: '',
        html: `<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 26 26">
                 <circle cx="13" cy="13" r="10" fill="${bgFill}" stroke="${color}" stroke-width="${sw}"/>
                 <text x="13" y="17" text-anchor="middle" fill="${color}"
                   font-size="9" font-weight="${fw}" font-family="sans-serif">${i + 1}</text>
               </svg>`,
        iconSize: [26, 26], iconAnchor: [13, 13]
      }),
      zIndexOffset: 800,
      draggable: true
    }).addTo(map);

    m.on('drag', function() {
      const p = m.getLatLng();
      routeLine.setLatLngs(route.map((wp, j) => j === i ? [p.lat, p.lng] : [wp.lat, wp.lon]));
    });

    m.on('dragend', function() {
      const p = m.getLatLng();
      route[i] = { lat: p.lat, lon: p.lng };
      renderRouteOnMap();
      updateRoutePanel();
      postRouteToServer();
    });

    routeMarkers.push(m);
  });
}

function addRouteWp(lat, lon) {
  route.push({ lat, lon });
  renderRouteOnMap();
  updateRoutePanel();
  postRouteToServer();
}

function removeRouteWp(idx) {
  route.splice(idx, 1);
  if (routeActive) {
    if (idx < currentWpIdx) {
      currentWpIdx--;
    } else if (idx === currentWpIdx) {
      if (currentWpIdx >= route.length) currentWpIdx = Math.max(0, route.length - 1);
      if (!route.length) routeActive = false;
    }
  }
  renderRouteOnMap();
  updateRoutePanel();
  postRouteToServer();
}

function clearRoute() {
  if (!confirm('Tyhjennetäänkö reitti?')) return;
  route = [];
  routeActive = false;
  currentWpIdx = 0;
  renderRouteOnMap();
  updateRoutePanel();
  closeSettings();
  postRouteToServer();
}

function cancelWpAddMode() {
  wpAddMode = false;
  document.getElementById('btn-add-wp').classList.remove('active');
  document.getElementById('wp-hint').style.display = 'none';
}

function toggleWpAddMode() {
  if (wpAddMode) { cancelWpAddMode(); return; }
  wpAddMode = true;
  document.getElementById('btn-add-wp').classList.add('active');
  document.getElementById('wp-hint').style.display = 'block';
  closeSettings();
}

function startRoute() {
  if (!route.length) return;
  routeActive = true;
  currentWpIdx = 0;
  renderRouteOnMap();
  updateRoutePanel();
  closeSettings();
  postRouteToServer();
}

function advanceToNextWp() {
  if (!routeActive) return;
  currentWpIdx++;
  if (currentWpIdx >= route.length) {
    routeActive = false;
    currentWpIdx = route.length - 1;
  }
  renderRouteOnMap();
  updateRoutePanel();
  postRouteToServer();
}

function checkAutoAdvance(lat, lon) {
  if (!routeActive || !autoAdvance || currentWpIdx >= route.length) return;
  const wp = route[currentWpIdx];
  if (distNm(lat, lon, wp.lat, wp.lon) < advanceRadiusNm) {
    advanceToNextWp();
  }
}

function toggleAutoAdvance() {
  autoAdvance = !autoAdvance;
  document.getElementById('toggle-autoadvance').classList.toggle('on', autoAdvance);
}

function changeAdvanceRadius(delta) {
  advanceRadiusNm = Math.round(
    Math.min(1.00, Math.max(0.05, advanceRadiusNm + delta * 0.05)) * 100
  ) / 100;
  document.getElementById('advance-val').textContent = advanceRadiusNm.toFixed(2) + ' nm';
}

async function postRouteToServer() {
  try {
    await fetch('/route', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        waypoints: route,
        active_idx: routeActive ? currentWpIdx : -1
      })
    });
  } catch (_) {}
}

function renderAnchorOnMap() {

  if (anchorCircle) { anchorCircle.remove(); anchorCircle = null; }

function toggleAnchorWatch() {

function changeAnchorRadius(delta) {

function toBeaufort(mps) {
  const scale = [
    [0.3,  0, 'Tyyntä',      '#3fb950'],
    [1.6,  1, 'Heikko',      '#3fb950'],
    [3.4,  2, 'Heikko',      '#3fb950'],
    [5.5,  3, 'Kohtalainen', '#3fb950'],
    [8.0,  4, 'Kohtalainen', '#3fb950'],
    [10.8, 5, 'Navakka',     '#d29922'],
    [13.9, 6, 'Navakka',     '#d29922'],
    [17.2, 7, 'Kova',        '#d29922'],
    [20.8, 8, 'Kova tuuli',  '#f85149'],
    [24.5, 9, 'Myrsky',      '#f85149'],
    [28.5,10, 'Kova myrsky', '#f85149'],
    [32.7,11, 'Myrsky',      '#f85149'],
  ];
  for (const [lim, n, label, color] of scale) {
    if (mps < lim) return { n, label, color };
  }
  return { n: 12, label: 'Hurrikaani', color: '#f85149' };
}

(function drawWindTicksSmall() {
  const g = document.getElementById('wind-ticks-small');
  if (!g) return;
  for (let i = 0; i < 72; i++) {
    const deg = i * 5;
    const rad = deg * Math.PI / 180;
    const isMajor = deg % 30 === 0;
    const isMed   = deg % 10 === 0;
    const r1 = isMajor ? 110 : isMed ? 117 : 121;
    const x1 = 140 + r1  * Math.sin(rad), y1 = 140 - r1  * Math.cos(rad);
    const x2 = 140 + 127 * Math.sin(rad), y2 = 140 - 127 * Math.cos(rad);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('stroke', isMajor ? '#8b949e' : isMed ? '#4a5568' : '#30363d');
    line.setAttribute('stroke-width', isMajor ? '2' : '1');
    g.appendChild(line);
  }
})();

function updateWindWidget(speed, dir, valid) {
  const widget = document.getElementById('wind-widget');
  if (!valid) { widget.style.display = 'none'; return; }

    .setAttribute('transform', `rotate(${_windArrowDeg}, 140, 140)`);
  document.getElementById('wind-speed-val').textContent = speed.toFixed(1) + ' m/s';
  const bft = toBeaufort(speed);
  const bftEl = document.getElementById('wind-bft-val');

// ── GPS poll ─────────────────────────────────────────────────────────────────
async function pollGPS() {
  try {
    const r = await fetch('/gps');
    if (!r.ok) return;
    const gps = await r.json();
    updateInfo(gps);
    if (gps.fix && gps.lat != null && gps.lon != null) {
      const { lat, lon } = gps;
      const cog = gps.cog_deg || 0, sog = gps.sog_knots || 0;
      _lastSog = sog;
      updateBoat(lat, lon, cog);
      updateMinuteLine(lat, lon, cog, sog);
      checkAutoAdvance(lat, lon);
      updateRoutePanel();
      if (sog > 0.5 && alertEnabled) {
        const [pLat, pLon] = projectPos(lat, lon, cog, sog, alertMinutes);
        showGroundingAlert(!inLake(pLat, pLon));
      } else {
        showGroundingAlert(false);
      }
    }
  } catch (_) {}
}

// ── Karilleajovaroitus ───────────────────────────────────────────────────────
let lakeRings = [];
let groundingActive = false;
let alertEnabled = true;
let alertMinutes = 5;

function toggleAlertEnabled() {
  alertEnabled = !alertEnabled;
  document.getElementById('toggle-alert').classList.toggle('on', alertEnabled);
  if (!alertEnabled) showGroundingAlert(false);
}

function changeAlertMin(delta) {
  alertMinutes = Math.min(10, Math.max(1, alertMinutes + delta));
  document.getElementById('alert-val').textContent = alertMinutes + ' min';
}

fetch('/static/nasijärvi.geojson')
  .then(r => r.json())
  .then(gj => {
    for (const feat of gj.features) {
      const geom = feat.geometry;
      const polys = geom.type === 'MultiPolygon' ? geom.coordinates : [geom.coordinates];
      for (const poly of polys) {
        const outer = poly[0].map(c => [c[1], c[0]]);
        const holes = poly.slice(1).map(h => h.map(c => [c[1], c[0]]));
        lakeRings.push({ outer, holes });
      }
    }
  })
  .catch(() => {});

function pointInRing(lat, lon, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [lati, loni] = ring[i], [latj, lonj] = ring[j];
    if ((loni > lon) !== (lonj > lon) &&
        lat < (latj - lati) * (lon - loni) / (lonj - loni) + lati)
      inside = !inside;
  }
  return inside;
}

function inLake(lat, lon) {
  if (!lakeRings.length) return true;
  for (const { outer, holes } of lakeRings) {
    if (!pointInRing(lat, lon, outer)) continue;
    if (holes.some(h => pointInRing(lat, lon, h))) continue;
    return true;
  }
  return false;
}

function showGroundingAlert(danger) {
  if (danger === groundingActive) return;
  groundingActive = danger;
  document.getElementById('grounding-alert').style.display = danger ? 'block' : 'none';
  if (danger) playBeep();
}

// ── Hälytysääni ──────────────────────────────────────────────────────────────
let audioCtx = null;
let soundEnabled = false;

function toggleSound() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  soundEnabled = !soundEnabled;
  document.getElementById('toggle-sound').classList.toggle('on', soundEnabled);
}

function playBeep() {
  if (!audioCtx || !soundEnabled) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.frequency.value = 880;
  gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
  osc.start(); osc.stop(audioCtx.currentTime + 0.5);
}
