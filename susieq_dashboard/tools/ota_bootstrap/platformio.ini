; OTA watchdog bootstrap — pieni väliohjelma cockpit-ESP32:lle
;
; Käyttö: kun laitteella pyörivä firmware watchdog-resetoi kesken
; varsinaisen dashboard-firmwaren OTA-siirron (siirto liian iso/hidas
; mahtuakseen alle watchdogin timeoutin), viedään ensin tämä pieni
; WiFi+OTA-only ohjelma (ei watchdogia, ei sensoreita, ei web-serveriä),
; ja sen päälle sitten varsinainen firmware toisella OTA-siirrolla ilman
; aikapainetta.
;
; ks. susieq_dashboard/tools/ota_bootstrap/README.md

[env:esp32dev-ota]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
upload_protocol = espota
upload_port = 192.168.8.100
upload_flags =
    --auth=susieq_ota
