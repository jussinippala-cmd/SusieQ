; SusieQ Bow Unit — ESP32-CAM + TF-Luna LiDAR

[common_bow]
lib_deps =
    ottowinter/ESPAsyncWebServer-esphome @ ^3.1.0
    mathieucarbou/AsyncTCP @ ^3.1.4
    bblanchon/ArduinoJson @ ^7.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM

; ─── USB flash (ensimmäinen kerta) ────────────────────────────────────
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
lib_deps = ${common_bow.lib_deps}
board_build.partitions = min_spiffs.csv
build_flags = ${common_bow.build_flags}

; ─── WiFi OTA flash (kun firmware on jo asennettuna) ──────────────────
[env:esp32cam-ota]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
lib_deps = ${common_bow.lib_deps}
board_build.partitions = min_spiffs.csv
build_flags = ${common_bow.build_flags}
upload_protocol = espota
upload_port = susieq-bow.local       ; mDNS hostname
upload_flags =
    --auth=susieq_ota
